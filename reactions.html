<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなの反応 | gekko</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background: #fafafa; color: #222; }
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #e5e5e5; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: #888; font-size: 12px; }
  button { font: inherit; cursor: pointer; border: 1px solid #ddd; background: #fff; border-radius: 999px; padding: 7px 16px; }
  button.primary { background: #FF2E88; border-color: #FF2E88; color: #fff; font-weight: 700; }
  main { max-width: 1500px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .embed { padding: 10px; }
  .mtext { background: #f6f6f6; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; }
  .mtext .who { font-weight: 700; margin-bottom: 2px; }
  .mtext .who span { color: #888; font-weight: 400; }
  .mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .mgrid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
  .mphoto { width: 100%; max-height: 340px; object-fit: cover; border-radius: 8px; display: block; }
  .mvideo { width: 100%; border-radius: 8px; display: block; background: #000; }
  .igembed { width: 100%; height: 430px; border: 0; border-radius: 8px; }
  .plink { font-size: 13px; color: #FF2E88; word-break: break-all; }
  .evinfo { border-top: 1px solid #eee; padding: 10px 12px; margin-top: auto; }
  .evinfo .t { font-weight: 700; font-size: 14px; }
  .evinfo .d { color: #666; font-size: 12px; margin-top: 2px; }
  .evinfo a { display: inline-block; margin-top: 6px; font-size: 12px; color: #FF2E88; text-decoration: none; font-weight: 700; }
  .msg { text-align: center; color: #888; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>みんなの反応</h1>
  <span class="sub" id="count"></span>
  <input id="q" type="search" placeholder="イベント名・会場で検索" style="font:inherit;border:1px solid #ddd;border-radius:999px;padding:7px 14px;background:#fff;flex:1;min-width:150px;">
  <select id="sortSel" aria-label="並び順" style="font:inherit;border:1px solid #ddd;border-radius:999px;padding:7px 10px;background:#fff;">
    <option value="desc">開催日が新しい順</option>
    <option value="asc">開催日が古い順</option>
    <option value="random">ランダム</option>
  </select>
  <select id="sizeSel" aria-label="1ページの表示件数" style="font:inherit;border:1px solid #ddd;border-radius:999px;padding:7px 10px;background:#fff;">
    <option value="10">10件</option>
    <option value="30">30件</option>
  </select>
  <button class="primary" id="shuffleBtn">シャッフル</button>
</header>
<main>
  <div id="filternote" style="display:none;background:#fff;border:1px solid #ffd3e8;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;"></div>
  <div class="msg" id="msg">読み込んでいます…</div>
  <div class="grid" id="grid"></div>
  <div id="pager" style="text-align:center;padding:18px 0 6px;"></div>
</main>
<script>
var API_BASE = 'https://gekko-events-api.gekkoandmoon.workers.dev';
var ITEMS = [];
var ALL_ITEMS = [];
var EV_COUNT = 0;
var QUERY = '';
var EVENT_ID = '';
var SORT = 'desc';
try { SORT = localStorage.getItem('gekko_rp_sort') || 'desc'; } catch (e) {}
if (SORT !== 'asc' && SORT !== 'random') SORT = 'desc';
try {
  var _params = new URLSearchParams(location.search);
  QUERY = _params.get('q') || '';
  EVENT_ID = _params.get('event') || '';
} catch (e) {}
var RP_SIZE = 30;
try { RP_SIZE = parseInt(localStorage.getItem('gekko_rp_size') || '30', 10) || 30; } catch (e) {}
var RP_PAGE = 1;
try { RP_PAGE = parseInt(localStorage.getItem('gekko_rp_page') || '1', 10) || 1; } catch (e) {}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function apiGet(params) {
  var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(API_BASE + '?' + qs).then(function (r) { return r.json(); });
}
function shuffleArr(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function embedHtml(m, url) {
  if (!m) return '<a class="plink" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>';
  if (m.kind === 'ig') return '<iframe class="igembed" src="' + esc(m.embedUrl) + '" loading="lazy"></iframe>';
  if (m.kind === 'x') {
    var h = '';
    if (m.text) h += '<div class="mtext"><div class="who">' + esc(m.userName) + ' <span>@' + esc(m.userScreen) + '</span></div>' + esc(m.text) + '</div>';
    var photos = m.photos || [];
    if (photos.length === 1) h += '<img class="mphoto" src="' + esc(photos[0]) + '" loading="lazy">';
    else if (photos.length > 1) h += '<div class="mgrid">' + photos.map(function (p) { return '<img src="' + esc(p) + '" loading="lazy">'; }).join('') + '</div>';
    if (m.video) h += '<video class="mvideo" src="' + esc(m.video) + '" poster="' + esc(m.poster || '') + '" controls playsinline preload="none"></video>';
    if (!h) h = '<a class="plink" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>';
    return h;
  }
  return '<a class="plink" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>';
}
function render() {
  var grid = document.getElementById('grid');
  var pages = Math.max(1, Math.ceil(ITEMS.length / RP_SIZE));
  if (RP_PAGE > pages) RP_PAGE = pages;
  var start = (RP_PAGE - 1) * RP_SIZE;
  var slice = ITEMS.slice(start, start + RP_SIZE);
  grid.innerHTML = slice.map(function (it, k) {
    var i = start + k;
    return '<div class="card"><div class="embed" id="emb' + i + '"><span class="plink">' + esc(it.url) + '</span></div>' +
      '<div class="evinfo"><div class="t">' + esc(it.ev.title) + '</div>' +
      '<div class="d">' + esc(it.ev.startText || '') + (it.ev.venue ? ' / ' + esc(it.ev.venue) : '') + '</div>' +
      '<a href="index.html#event=' + encodeURIComponent(it.ev.id) + '">このイベントを見る →</a></div></div>';
  }).join('');
  slice.forEach(function (it, k) {
    var i = start + k;
    apiGet({ action: 'postMedia', url: it.url }).then(function (m) {
      var el = document.getElementById('emb' + i);
      if (el) el.innerHTML = embedHtml(m, it.url);
    }).catch(function () { /* リンク表示のまま */ });
  });
  try { localStorage.setItem('gekko_rp_page', String(RP_PAGE)); } catch (e) {}
  var pg = document.getElementById('pager');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  pg.innerHTML = '<button id="pgPrev"' + (RP_PAGE <= 1 ? ' disabled' : '') + '>← 前へ</button>' +
    '<span style="margin:0 12px;color:#666;font-size:13px;">' + RP_PAGE + ' / ' + pages + ' ページ（全' + ITEMS.length + '件）</span>' +
    '<button id="pgNext"' + (RP_PAGE >= pages ? ' disabled' : '') + '>次へ →</button>';
  document.getElementById('pgPrev').addEventListener('click', function () { if (RP_PAGE > 1) { RP_PAGE--; window.scrollTo(0, 0); render(); } });
  document.getElementById('pgNext').addEventListener('click', function () { if (RP_PAGE < pages) { RP_PAGE++; window.scrollTo(0, 0); render(); } });
}
function rebuild() {
  var q = QUERY.trim().toLowerCase();
  ITEMS = ALL_ITEMS.filter(function (it) {
    if (EVENT_ID && it.ev.id !== EVENT_ID) return false;
    if (!q) return true;
    var hay = (it.ev.title + ' ' + (it.ev.venue || '') + ' ' + (it.ev.startText || '')).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  if (SORT === 'random') shuffleArr(ITEMS);
  else ITEMS.sort(function (a, b) {
    var d = new Date(a.ev.start).getTime() - new Date(b.ev.start).getTime();
    return SORT === 'asc' ? d : -d;
  });
  var filtered = !!(EVENT_ID || q);
  document.getElementById('count').textContent = ITEMS.length + '件の反応' + (filtered ? '（全' + ALL_ITEMS.length + '件中）' : '') + ' / ' + EV_COUNT + 'イベント';
  var note = document.getElementById('filternote');
  if (EVENT_ID) {
    var t = '';
    for (var i = 0; i < ALL_ITEMS.length; i++) { if (ALL_ITEMS[i].ev.id === EVENT_ID) { t = ALL_ITEMS[i].ev.title; break; } }
    note.innerHTML = '「' + esc(t || 'このイベント') + '」の反応だけ表示中　<button id="clearEv" style="padding:3px 10px;font-size:12px;">絞り込みを解除</button>';
    note.style.display = 'block';
    document.getElementById('clearEv').addEventListener('click', function () {
      EVENT_ID = '';
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      RP_PAGE = 1;
      rebuild(); render();
    });
  } else {
    note.style.display = 'none';
    note.innerHTML = '';
  }
  var msg = document.getElementById('msg');
  if (!ALL_ITEMS.length) { msg.style.display = 'block'; msg.textContent = 'まだ反応が登録されていません'; }
  else if (!ITEMS.length) { msg.style.display = 'block'; msg.textContent = '条件に合う反応がありません'; }
  else msg.style.display = 'none';
}
function applyData_(r) {
  ALL_ITEMS = [];
  EV_COUNT = (r.events || []).length;
  (r.events || []).forEach(function (ev) {
    String(ev.mediaUrls || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (u) {
      ALL_ITEMS.push({ ev: ev, url: u });
    });
  });
  rebuild();
  render();
}
function load() {
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('gekko_react_v2') || 'null'); } catch (e) {}
  if (cached && cached.events) applyData_(cached);
  apiGet({ action: 'reactions' }).then(function (r) {
    if (!r || !r.ok) throw new Error('load failed');
    var changed = JSON.stringify(r.events) !== JSON.stringify(cached && cached.events);
    try { localStorage.setItem('gekko_react_v2', JSON.stringify({ events: r.events })); } catch (e) {}
    if (!cached || changed) applyData_(r);
  }).catch(function () {
    if (!cached) document.getElementById('msg').textContent = '読み込みに失敗しました。時間をおいて再読み込みしてください';
  });
}
document.getElementById('shuffleBtn').addEventListener('click', function () {
  SORT = 'random';
  document.getElementById('sortSel').value = 'random';
  try { localStorage.setItem('gekko_rp_sort', 'random'); } catch (e) {}
  RP_PAGE = 1;
  rebuild(); render();
});
(function () {
  var qEl = document.getElementById('q');
  qEl.value = QUERY;
  qEl.addEventListener('input', function () { QUERY = this.value; RP_PAGE = 1; rebuild(); render(); });
  var sortSel = document.getElementById('sortSel');
  sortSel.value = SORT;
  sortSel.addEventListener('change', function () {
    SORT = this.value;
    try { localStorage.setItem('gekko_rp_sort', SORT); } catch (e) {}
    RP_PAGE = 1;
    rebuild(); render();
  });
  var sel = document.getElementById('sizeSel');
  sel.value = String(RP_SIZE);
  sel.addEventListener('change', function () {
    RP_SIZE = parseInt(this.value, 10) || 30;
    try { localStorage.setItem('gekko_rp_size', String(RP_SIZE)); } catch (e) {}
    RP_PAGE = 1;
    render();
  });
})();
load();
</script>
</body>
</html>
